[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-from-attention-to-qwen"
version = "0.1.0"
description = "AttentionからQwen-VLまで、VLMの進化を実装しながら追って学ぶ教材（marimoノートブック + NumPyパッケージ）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# ノートブックを開く / 図を描くため
notebooks = [
    "marimo>=0.13",
    "matplotlib>=3.8",
    "pillow>=10.0",
]
# テスト
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
]
# 06章「本物のQwen3-VLに触れる」オプション（重い）
qwen = [
    "torch>=2.2",
    "transformers>=4.57",
    "qwen-vl-utils>=0.0.14",
]

[tool.setuptools.packages.find]
include = ["vlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
